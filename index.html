<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pindah WhatsApp Aja Ga Si?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0f0c;
    --bg-1:#111a15;
    --panel:#141f19;
    --panel-2:#0e1713;
    --gold:#c9a24a;
    --gold-soft:#e6cf96;
    --text:#f3efe6;
    --muted:#9fb0a6;
    --line: rgba(201,162,74,0.22);
    --field:#0c140f;
    --wa:#3fc77a;
  }

  *{ box-sizing:border-box; }

  html, body{
    height:100%;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(201,162,74,0.08), transparent 60%),
      radial-gradient(700px 500px at 100% 100%, rgba(63,199,122,0.06), transparent 55%),
      var(--bg-0);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    padding: 40px 20px;
  }

  .card{
    position: relative;
    width:100%;
    max-width:420px;
    background: linear-gradient(175deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 44px 36px 36px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    overflow: hidden;
  }

  .card::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    opacity:0.5;
  }

  .corner-mark{
    position:absolute;
    width:34px; height:34px;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
    top:16px; left:16px;
  }
  .corner-mark.br{
    top:auto; left:auto; bottom:16px; right:16px;
    border-top:none; border-left:none;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  .portrait-wrap{
    display:flex;
    justify-content:center;
    margin-bottom: 24px;
  }

  .portrait-frame{
    position:relative;
    width:112px;
    height:112px;
    border-radius:50%;
    padding: 4px;
    background: conic-gradient(from 180deg, var(--gold), var(--gold-soft), var(--gold));
  }

  .portrait-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2a3a30, #0e1713);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border: 2px solid var(--bg-0);
  }

  .eyebrow{
    text-align:center;
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--gold-soft);
    margin: 0 0 10px;
    font-weight: 500;
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    text-align:center;
    font-size: 32px;
    line-height:1.2;
    letter-spacing: -0.3px;
    margin: 0 0 6px;
    color: var(--text);
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }

  .sub{
    text-align:center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px;
  }

  label{
    display:block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .field{
    margin-bottom: 18px;
  }

  input{
    width:100%;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 15px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  input::placeholder{
    color: #5c6b63;
  }

  input:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,162,74,0.12);
  }

  .error{
    color:#e0896f;
    font-size:12px;
    margin-top:6px;
    min-height:14px;
  }

  button{
    width:100%;
    margin-top: 10px;
    padding: 15px;
    border:1px solid var(--gold);
    border-radius: 10px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #15110a;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor:pointer;
    transition: transform .08s ease, filter .15s ease;
    font-family: 'Inter', sans-serif;
  }

  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity:0.6; cursor:default; }

  .result{
    display:none;
    margin-top: 20px;
    padding: 18px;
    background: rgba(63,199,122,0.07);
    border: 1px solid rgba(63,199,122,0.3);
    border-radius: 12px;
    text-align:center;
  }

  .result.show{ display:block; }

  .result p{
    margin: 0 0 14px;
    font-size: 14px;
    color: var(--text);
  }

  .result a{
    display:inline-block;
    background: var(--wa);
    color:#06210f;
    text-decoration:none;
    font-weight:600;
    font-size:13px;
    padding: 11px 20px;
    border-radius: 8px;
    letter-spacing: 0.3px;
  }

  .footnote{
    text-align:center;
    color: #5c6b63;
    font-size:11px;
    margin-top:26px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="corner-mark"></div>
    <div class="corner-mark br"></div>

    <!-- BAGIAN FOTO (UDAH DIPERBAIKI) -->
    <div class="portrait-wrap">
      <div class="portrait-frame">
        <div class="portrait-inner">
          <!-- Ganti '123.png' dengan nama file foto kamu yang sebenarnya -->
          <img src="123.png" alt="Foto Profil" style="width:100%; height:100%; object-fit:cover;">
        </div>
      </div>
    </div>

    <!-- BAGIAN TEKS (SEKARANG DI LUAR LINGKARAN) -->
    <p class="eyebrow">KONTAK BARU</p>
    <h1>Pindah WhatsApp<br>Aja Ga Si?</h1>
    <p class="sub">hehehehehehehe</p>

    <form id="moveForm" novalidate>
      <div class="field">
        <label for="contactName">Nama Kontak</label>
        <input type="text" id="contactName" placeholder="untuk di contact ku" autocomplete="off">
        <div class="error" id="nameError"></div>
      </div>

      <div class="field">
        <label for="waNumber">Nomor WhatsApp</label>
        <input type="tel" id="waNumber" placeholder="08xxxxxxxxxx" inputmode="numeric" autocomplete="off">
        <div class="error" id="numError"></div>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div class="result" id="result">
      <p id="resultText"></p>
      <a id="waLink" href="#" target="_blank" rel="noopener">Buka Chat WhatsApp</a>
    </div>

    <p class="footnote">Data cuma disimpan di percakapan ini, ga dikirim kemana-mana.</p>
  </div>

<script>
  // ==== GANTI BARIS DI BAWAH INI ====
  // Ambil URL endpoint dari akun Formspree kamu (formspree.io -> New Form)
  const FORMSPREE_ENDPOINT = 'GANTI_DENGAN_ENDPOINT_FORMSPREE'; // contoh: https://formspree.io/f/xxxxxxxx
  // ===================================

  const form = document.getElementById('moveForm');
  const nameInput = document.getElementById('contactName');
  const numInput = document.getElementById('waNumber');
  const nameError = document.getElementById('nameError');
  const numError = document.getElementById('numError');
  const result = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const waLink = document.getElementById('waLink');
  const submitBtn = form.querySelector('button[type="submit"]');

  function normalizeNumber(raw){
    let digits = raw.replace(/[^\d]/g, '');
    if(digits.startsWith('0')) digits = '62' + digits.slice(1);
    else if(digits.startsWith('8')) digits = '62' + digits;
    return digits;
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    nameError.textContent = '';
    numError.textContent = '';
    result.classList.remove('show');

    const name = nameInput.value.trim();
    const numRaw = numInput.value.trim();
    let valid = true;

    if(!name){
      nameError.textContent = 'Isi nama dulu ya.';
      valid = false;
    }

    const digitsOnly = numRaw.replace(/[^\d]/g, '');
    if(!numRaw){
      numError.textContent = 'Isi nomor WhatsApp dulu ya.';
      valid = false;
    } else if(digitsOnly.length < 9 || digitsOnly.length > 14){
      numError.textContent = 'Cek lagi nomornya, kayanya kurang/kelebihan digit.';
      valid = false;
    }

    if(!valid) return;

    const waNumber = normalizeNumber(numRaw);

    if(FORMSPREE_ENDPOINT && FORMSPREE_ENDPOINT.startsWith('https://formspree.io/')){
      submitBtn.disabled = true;
      submitBtn.textContent = 'Mengirim...';
      try{
        await fetch(FORMSPREE_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            nama: name,
            nomor_whatsapp: '+' + waNumber
          })
        });
      } catch(err){
        console.error('Gagal kirim ke Formspree:', err);
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
    } else {
      console.warn('FORMSPREE_ENDPOINT belum diganti, data cuma tampil di layar, tidak terkirim ke email.');
    }

    resultText.textContent = 'Sip, ' + name + ' udah dicatet dengan nomor +' + waNumber + '.';
    waLink.href = 'https://wa.me/' + waNumber;
    result.classList.add('show');
    form.reset();
  });
</script>

</body>
</html>
